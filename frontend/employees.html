<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Employees | Asset Tracker
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="employees">
    <div id="appNav">
    </div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">
            Employees
          </h1>
          <p class="text-secondary mb-0">
            Manage employee records.
          </p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal" id="addEmployeeBtn">
          Add employee
        </button>
      </div>
      <div id="pageMessage">
      </div>
      <div class="card">
        <div class="card-body border-bottom">
          <input class="form-control" id="employeeSearch" placeholder="Search by name, department, email, or title">
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>
                  Name
                </th>
                <th>
                  Contact
                </th>
                <th>
                  Job title
                </th>
                <th>
                  Department
                </th>
                <th class="text-end">
                  Actions
                </th>
              </tr>
            </thead>
            <tbody id="employeeTable">
              <tr>
                <td colspan="5" class="text-center text-secondary p-4">
                  Loading…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <div class="modal fade" id="employeeModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="employeeForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="employeeModalTitle">
                Add employee
              </h2>
              <button class="btn-close" data-bs-dismiss="modal" type="button">
              </button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="employeeId">
              <div class="mb-3">
                <label class="form-label">
                  Full name
                </label>
                <input class="form-control" id="employeeName" required>
              </div>
              <div class="mb-3">
                <label class="form-label">
                  Email
                </label>
                <input class="form-control" id="employeeEmail" type="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">
                  Phone
                </label>
                <input class="form-control" id="employeePhone" required>
              </div>
              <div class="mb-3">
                <label class="form-label">
                  Job title
                </label>
                <input class="form-control" id="employeeTitle" required>
              </div>
              <div>
                <label class="form-label">
                  Department
                </label>
                <input class="form-control" id="employeeDepartment" required>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-light" data-bs-dismiss="modal" type="button">
                Cancel
              </button>
              <button class="btn btn-primary" type="submit">
                Save employee
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="script.js">
    </script>
  </body>
</html>
