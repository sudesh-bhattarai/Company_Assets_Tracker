<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Company Asset Tracker | Login
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="login-page">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <section class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="brand-mark">
                  AT
                </div>
                <h1 class="h3 mt-3">
                  Company Asset Tracker
                </h1>
                <p class="text-secondary mb-0">
                  Administrator sign in
                </p>
              </div>
              <div id="loginMessage">
              </div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="loginEmail">
                    Email
                  </label>
                  <input id="loginEmail" class="form-control" type="email" value="admin@company.com" required>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="loginPassword">
                    Password
                  </label>
                  <input id="loginPassword" class="form-control" type="password" value="admin123" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  Sign in
                </button>
              </form>
              <p class="small text-secondary text-center mt-3 mb-0">
                Demo access: any valid email and password.
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="script.js">
    </script>
  </body>
</html>
