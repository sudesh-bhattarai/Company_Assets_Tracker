<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Assets | Asset Tracker
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body data-page="assets">
    <div id="appNav">
    </div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">
            Assets
          </h1>
          <p class="text-secondary mb-0">
            Manage company equipment and inventory.
          </p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assetModal" id="addAssetBtn">
          Add asset
        </button>
      </div>
      <div id="pageMessage">
      </div>
      <div class="card">
        <div class="card-body border-bottom">
          <input class="form-control" id="assetSearch" placeholder="Search by tag, name, category, or serial number">
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>
                  Asset
                </th>
                <th>
                  Category
                </th>
                <th>
                  Serial no.
                </th>
                <th>
                  Status
                </th>
                <th>
                  Condition
                </th>
                <th class="text-end">
                  Actions
                </th>
              </tr>
            </thead>
            <tbody id="assetTable">
              <tr>
                <td colspan="6" class="text-center text-secondary p-4">
                  Loading…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <div class="modal fade" id="assetModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="assetForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="assetModalTitle">
                Add asset
              </h2>
              <button class="btn-close" data-bs-dismiss="modal" type="button">
              </button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="assetId">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    Asset tag
                  </label>
                  <input class="form-control" id="assetTag" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    Asset name
                  </label>
                  <input class="form-control" id="assetName" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    Category
                  </label>
                  <input class="form-control" id="assetCategory" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    Serial number
                  </label>
                  <input class="form-control" id="assetSerial" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">
                    Purchase date
                  </label>
                  <input class="form-control" id="assetPurchaseDate" type="date">
                </div>
                <div class="col-md-4">
                  <label class="form-label">
                    Status
                  </label>
                  <select class="form-select" id="assetStatus">
                    <option>
                      Available
                    </option>
                    <option>
                      Assigned
                    </option>
                    <option>
                      Maintenance
                    </option>
                    <option>
                      Retired
                    </option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">
                    Condition
                  </label>
                  <select class="form-select" id="assetCondition">
                    <option>
                      Good
                    </option>
                    <option>
                      Fair
                    </option>
                    <option>
                      Poor
                    </option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-light" data-bs-dismiss="modal" type="button">
                Cancel
              </button>
              <button class="btn btn-primary" type="submit">
                Save asset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="../js/core.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/employees.js"></script>
    <script src="../js/assets.js"></script>
    <script src="../js/assignments.js"></script>
    <script src="../js/maintenance.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
