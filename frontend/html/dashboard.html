<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Dashboard | Asset Tracker
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body data-page="dashboard">
    <div id="appNav">
    </div>
    <main class="container py-4">
      <div class="dashboard-heading d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">
            Dashboard
          </h1>
          <p class="text-secondary mb-0">
            Overview of company assets and employees.
          </p>
        </div>
        <button class="btn btn-outline-primary btn-sm" id="refreshDashboard">
          Refresh
        </button>
      </div>
      <div id="pageMessage">
      </div>
      <div class="dashboard-summary row g-3 mb-4">
        <div class="col-sm-6 col-lg">
          <div class="card stat-card stat-card-total">
            <div class="card-body">
              <span>
                Total assets
              </span>
              <strong id="totalAssets">
                —
              </strong>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg">
          <div class="card stat-card stat-card-available">
            <div class="card-body">
              <span>
                Available
              </span>
              <strong id="availableAssets">
                —
              </strong>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg">
          <div class="card stat-card stat-card-assigned">
            <div class="card-body">
              <span>
                Assigned
              </span>
              <strong id="assignedAssets">
                —
              </strong>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg">
          <div class="card stat-card stat-card-maintenance">
            <div class="card-body">
              <span>
                Maintenance
              </span>
              <strong id="maintenanceAssets">
                —
              </strong>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg">
          <div class="card stat-card stat-card-employees">
            <div class="card-body">
              <span>
                Employees
              </span>
              <strong id="totalEmployees">
                —
              </strong>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-lg-7">
          <section class="card dashboard-panel">
            <div class="card-header bg-white">
              <h2 class="h6 mb-0">
                Recent assets
              </h2>
            </div>
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>
                      Tag
                    </th>
                    <th>
                      Name
                    </th>
                    <th>
                      Category
                    </th>
                    <th>
                      Status
                    </th>
                  </tr>
                </thead>
                <tbody id="recentAssets">
                  <tr>
                    <td colspan="4" class="text-center text-secondary">
                      Loading…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card dashboard-panel">
            <div class="card-header bg-white">
              <h2 class="h6 mb-0">
                Recent assignments
              </h2>
            </div>
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>
                      Asset
                    </th>
                    <th>
                      Employee
                    </th>
                    <th>
                      Date
                    </th>
                  </tr>
                </thead>
                <tbody id="recentAssignments">
                  <tr>
                    <td colspan="3" class="text-center text-secondary">
                      Loading…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="../js/core.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/employees.js"></script>
    <script src="../js/assets.js"></script>
    <script src="../js/assignments.js"></script>
    <script src="../js/maintenance.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
