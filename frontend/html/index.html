<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Company Asset Tracker | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body class="login-page">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <section class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <img src="../assets/logo/project-logo.jpeg" alt="Company Asset Tracker logo" class="logo">
                <h1 class="h3 mt-3">Company Asset Tracker</h1>
                <p class="text-secondary mb-0">Sign in to manage company assets.</p>
              </div>

              <div class="d-grid gap-2 d-sm-flex mb-4">
                <button class="btn btn-primary flex-fill" id="showLogin" type="button">Login</button>
                <button class="btn btn-outline-primary flex-fill" id="showSignup" type="button">Sign up</button>
              </div>

              <div id="loginMessage"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="loginEmail">Email</label>
                  <input id="loginEmail" class="form-control" type="email" required>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="loginPassword">Password</label>
                  <input id="loginPassword" class="form-control" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Login</button>
              </form>

              <form id="signupForm" class="d-none" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="signupEmail">Email</label>
                  <input id="signupEmail" class="form-control" type="email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="signupPassword">Password</label>
                  <input id="signupPassword" class="form-control" type="password" minlength="6" required>
                  <div class="form-text">Use at least 6 characters.</div>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="signupConfirmPassword">Confirm password</label>
                  <input id="signupConfirmPassword" class="form-control" type="password" minlength="6" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Create account</button>
              </form>

              <div class="text-center mt-4">
                <p class="small text-secondary mb-2">Want to explore the project without creating an account?</p>
                <button class="btn btn-outline-secondary w-100" id="tryDemo" type="button">
                  Try Demo
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/employees.js"></script>
    <script src="../js/assets.js"></script>
    <script src="../js/assignments.js"></script>
    <script src="../js/maintenance.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
